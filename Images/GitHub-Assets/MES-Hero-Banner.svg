<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">MES — Engineering Hero Banner</title><desc id="desc">Animated electronic circuit paths surrounding the MES brand.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06132B"/><stop offset="1" stop-color="#030817"/></linearGradient><linearGradient id="line"><stop stop-color="#145BCE" stop-opacity="0"/><stop offset=".5" stop-color="#00D8FF"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#087BFF" stop-opacity=".28"/><stop offset="1" stop-color="#087BFF" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="280" rx="18" fill="url(#bg)"/><ellipse cx="600" cy="140" rx="500" ry="170" fill="url(#halo)"/>
<g fill="none" stroke="#1476D9" stroke-opacity=".48" stroke-width="2"><path d="M0 65H170L210 105H330M0 215H135L175 175H300M1200 58H1030L990 98H870M1200 222H1060L1018 180H900"/><path d="M75 0V35L110 70H205M1125 0V36L1090 72H995M70 280V240L110 200H210M1130 280V240L1090 200H990"/></g>
<g fill="#06132B" stroke="#00C8FF" stroke-width="2"><circle cx="170" cy="65" r="5"/><circle cx="135" cy="215" r="5"/><circle cx="1030" cy="58" r="5"/><circle cx="1060" cy="222" r="5"/></g>
<path d="M0 140H1200" stroke="url(#line)" stroke-width="3" opacity=".65" filter="url(#glow)"/><path d="M0 140H260" stroke="url(#line)" stroke-width="4" stroke-dasharray="95 110"><animate attributeName="stroke-dashoffset" from="0" to="-410" dur="6s" repeatCount="indefinite"/></path><path d="M940 140H1200" stroke="url(#line)" stroke-width="4" stroke-dasharray="95 110"><animate attributeName="stroke-dashoffset" from="0" to="410" dur="6s" repeatCount="indefinite"/></path>
<g text-anchor="middle" font-family="Arial,Helvetica,sans-serif"><text x="600" y="116" fill="#EAF6FF" font-size="22" letter-spacing="8">MEMAR ELECTRONIC SANAT</text><text x="600" y="178" fill="#FFFFFF" font-size="62" font-weight="700" letter-spacing="5">MES</text><text x="600" y="213" fill="#77DFFF" font-size="18" letter-spacing="2">ELECTRONICS · EMBEDDED · PCB DESIGN</text></g>
<circle cx="600" cy="140" r="105" fill="none" stroke="#00D8FF" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="4 12"><animateTransform attributeName="transform" type="rotate" from="0 600 140" to="360 600 140" dur="48s" repeatCount="indefinite"/></circle>
<g fill="#00FFD1"><circle cx="300" cy="140" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="900" cy="140" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle></g></svg>