<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">MES — Animated Engineering Hero Banner</title>
<desc id="desc">MES identity with visibly moving light pulses, animated circuit traces and a rotating orbital ring.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06132B"/><stop offset="1" stop-color="#030817"/></linearGradient>
  <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#145BCE" stop-opacity="0"/><stop offset=".48" stop-color="#00D8FF"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#00D8FF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#087BFF" stop-opacity=".32"/><stop offset="1" stop-color="#087BFF" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="280" rx="18" fill="url(#bg)"/>
<ellipse cx="600" cy="140" rx="500" ry="170" fill="url(#halo)"/>
<g fill="none" stroke="#1476D9" stroke-opacity=".5" stroke-width="2">
  <path d="M0 65H170L210 105H330M0 215H135L175 175H300M1200 58H1030L990 98H870M1200 222H1060L1018 180H900"/>
  <path d="M75 0V35L110 70H205M1125 0V36L1090 72H995M70 280V240L110 200H210M1130 280V240L1090 200H990"/>
</g>
<g fill="#06132B" stroke="#00C8FF" stroke-width="2"><circle cx="170" cy="65" r="5"/><circle cx="135" cy="215" r="5"/><circle cx="1030" cy="58" r="5"/><circle cx="1060" cy="222" r="5"/></g>
<!-- Main circuit light sweep -->
<path d="M0 140H1200" stroke="url(#trace)" stroke-width="3" opacity=".65"/>
<path d="M0 140H1200" fill="none" stroke="url(#beam)" stroke-width="7" stroke-linecap="round" stroke-dasharray="90 1110" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="1200;0" dur="4.5s" repeatCount="indefinite"/>
</path>
<path d="M0 140H260M940 140H1200" fill="none" stroke="url(#trace)" stroke-width="4" stroke-dasharray="65 55">
  <animate attributeName="stroke-dashoffset" values="0;-240" dur="3s" repeatCount="indefinite"/>
</path>
<!-- Moving signal travelling around the frame -->
<path id="signalPath" d="M90 36H260L300 76H900L940 36H1110V244H940L900 204H300L260 244H90Z" fill="none" stroke="#00D8FF" stroke-opacity=".18" stroke-width="1.5"/>
<circle r="5" fill="#00FFD1" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#signalPath"/></animateMotion></circle>
<circle r="3" fill="#FFFFFF" filter="url(#glow)"><animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" rotate="auto"><mpath href="#signalPath"/></animateMotion></circle>
<!-- Brand -->
<g text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
  <text x="600" y="116" fill="#EAF6FF" font-size="22" letter-spacing="8">MEMAR ELECTRONIC SANAT</text>
  <text x="600" y="178" fill="#FFFFFF" font-size="62" font-weight="700" letter-spacing="5">MES</text>
  <text x="600" y="213" fill="#77DFFF" font-size="18" letter-spacing="2">ELECTRONICS · EMBEDDED · PCB DESIGN</text>
</g>
<circle cx="600" cy="140" r="105" fill="none" stroke="#00D8FF" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="4 12">
  <animateTransform attributeName="transform" type="rotate" from="0 600 140" to="360 600 140" dur="24s" repeatCount="indefinite"/>
</circle>
<circle cx="600" cy="140" r="91" fill="none" stroke="#00FFD1" stroke-opacity=".16" stroke-width="1" stroke-dasharray="2 18">
  <animateTransform attributeName="transform" type="rotate" from="360 600 140" to="0 600 140" dur="32s" repeatCount="indefinite"/>
</circle>
<g fill="#00FFD1">
  <circle cx="300" cy="140" r="3"><animate attributeName="r" values="2;7;2" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="140" r="3"><animate attributeName="r" values="6;2;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
</svg>