<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="t d"><title id="t">MES thank you footer</title><desc id="d">Animated closing banner with glowing circuit lines and MES identity.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06132B"/><stop offset="1" stop-color="#030817"/></linearGradient><linearGradient id="l"><stop stop-color="#00C8FF" stop-opacity="0"/><stop offset=".5" stop-color="#00FFD1"/><stop offset="1" stop-color="#00C8FF" stop-opacity="0"/></linearGradient><filter id="f"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="170" rx="16" fill="url(#bg)" stroke="#164B88"/><g fill="none" stroke="#1476D9" stroke-width="2" stroke-opacity=".6"><path d="M0 45H210L250 85H365M1200 45H990L950 85H835M0 128H180L220 90H350M1200 128H1020L980 90H850"/></g><path d="M90 85H1110" stroke="url(#l)" stroke-width="3" filter="url(#f)" stroke-dasharray="10 1000"><animate attributeName="stroke-dasharray" values="10 1000;300 700;10 1000" dur="5s" repeatCount="indefinite"/></path><g text-anchor="middle" font-family="Arial,Helvetica,sans-serif"><text x="600" y="68" fill="#EAF6FF" font-size="30" font-weight="700" letter-spacing="5">THANK YOU FOR VISITING</text><text x="600" y="105" fill="#71DFFF" font-size="17" letter-spacing="3">MEMAR ELECTRONIC SANAT · MES</text><text x="600" y="137" fill="#8DAFCF" font-size="13" letter-spacing="2">ENGINEERED WITH PRECISION</text></g><g fill="#00FFD1"><circle cx="250" cy="85" r="4"><animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/></circle><circle cx="950" cy="85" r="4"><animate attributeName="r" values="5;2;5" dur="2.4s" repeatCount="indefinite"/></circle></g></svg>