<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="t d">
<title id="t">MES Animated Thank You Footer</title>
<desc id="d">Closing MES banner with a bright travelling light beam, moving signal points and pulsing circuit nodes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06132B"/><stop offset="1" stop-color="#030817"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#00C8FF" stop-opacity="0"/><stop offset=".5" stop-color="#00FFD1"/><stop offset="1" stop-color="#00C8FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#00C8FF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="170" rx="16" fill="url(#bg)" stroke="#164B88" stroke-width="2"/>
<g fill="none" stroke="#1476D9" stroke-width="2" stroke-opacity=".6">
  <path d="M0 45H210L250 85H365M1200 45H990L950 85H835M0 128H180L220 90H350M1200 128H1020L980 90H850"/>
  <path d="M70 0V24L100 54H180M1130 0V24L1100 54H1020M70 170V146L100 116H180M1130 170V146L1100 116H1020"/>
</g>
<!-- Continuous travelling beam -->
<path d="M70 85H1130" stroke="url(#line)" stroke-width="3" opacity=".8"/>
<path d="M70 85H1130" fill="none" stroke="url(#beam)" stroke-width="9" stroke-linecap="round" stroke-dasharray="115 945" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="1060;0" dur="3.8s" repeatCount="indefinite"/>
</path>
<!-- Moving signal points on the horizontal trace -->
<circle r="5" fill="#FFFFFF" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#footerPath"/></animateMotion></circle>
<path id="footerPath" d="M90 85H1110" fill="none"/>
<circle r="3.5" fill="#00FFD1" filter="url(#glow)"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite"><mpath href="#footerPath"/></animateMotion></circle>
<g text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
  <text x="600" y="68" fill="#EAF6FF" font-size="30" font-weight="700" letter-spacing="5">THANK YOU FOR VISITING</text>
  <text x="600" y="105" fill="#71DFFF" font-size="17" letter-spacing="3">MEMAR ELECTRONIC SANAT · MES</text>
  <text x="600" y="137" fill="#8DAFCF" font-size="13" letter-spacing="2">ENGINEERED WITH PRECISION</text>
</g>
<g fill="#00FFD1">
  <circle cx="250" cy="85" r="4"><animate attributeName="r" values="2;7;2" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="85" r="4"><animate attributeName="r" values="7;2;7" dur="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
</g>
<rect x="2" y="2" width="1196" height="166" rx="15" fill="none" stroke="#00C8FF" stroke-opacity=".5" stroke-width="1">
  <animate attributeName="stroke-opacity" values=".15;.75;.15" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>